<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoppy — Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-main">
    <a href="index.html" class="logo">Shoppy<span class="logo-dot">.</span></a>
    <div class="header-actions">
      <button class="icon-btn" id="wishlistBtn" aria-label="Wishlist">
        <span class="badge" id="wishlistCount">0</span>
      </button>
      <button class="icon-btn" id="cartBtn" aria-label="Cart">
        <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap cart-page">
  <h1>Your Cart</h1>

  <section class="cart-main">
    <div class="cart-items" id="cartItems">
      <!-- filled by JS -->
    </div>

    <aside class="cart-summary">
      <div class="cart-row"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
      <div class="cart-row"><span>Delivery</span><span id="cartDelivery">₹0</span></div>
      <div class="cart-row cart-discount" id="cartDiscountRow" hidden><span id="cartDiscountLabel">Coupon</span><span id="cartDiscount">₹0</span></div>
      <div class="cart-row cart-total"><span>Total</span><span id="cartTotal">₹0</span></div>

      <div class="coupon-panel">
        <h4>Coupon</h4>
        <div class="coupon-row">
          <input id="couponInput" type="text" placeholder="Enter coupon code" autocomplete="off">
          <button class="btn btn-ghost btn-sm" id="applyCouponBtn" type="button">Apply</button>
        </div>
        <p class="coupon-hint" id="couponHint">Admin-generated coupons are available here.</p>
        <button class="coupon-remove" id="removeCouponBtn" type="button" hidden>Remove coupon</button>
      </div>

      <form class="checkout-panel" id="checkoutForm">
        <h4>Delivery & Payment</h4>
        <label class="field">
          <span>Delivery Address</span>
          <textarea id="deliveryAddress" rows="3" placeholder="Enter your full delivery address" required></textarea>
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Phone Number</span>
            <input id="phoneNumber" type="tel" placeholder="9876543210" required>
          </label>
          <label class="field">
            <span>Email Address</span>
            <input id="emailAddress" type="email" placeholder="you@example.com" required>
          </label>
        </div>

        <div class="payment-methods">
          <span>Payment Method</span>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="cod" checked><span>Cash on Delivery</span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="upi"><span>UPI</span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="card"><span>Card</span></label>
        </div>

        <div class="payment-details" id="paymentDetails"><p class="payment-hint">Pay with cash when your order arrives.</p></div>
      </form>

      <button class="btn btn-primary btn-block" id="checkoutBtn" type="button">Place Order</button>
    </aside>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <p>© 2026 Shoppy Retail Pvt. Ltd. Demo project.</p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
