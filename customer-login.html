<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoppy — Customer Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg,#f6f4fb 0%,#ffffff 100%); }
    .auth-card{ width:min(460px,100%); background:#fff; border:1px solid rgba(27,27,47,0.10); border-radius:24px; box-shadow:0 20px 40px -16px rgba(27,27,47,0.18); padding:28px; }
    .auth-card h2{ margin-bottom:8px; }
    .auth-card p{ color:var(--ink-soft); margin-bottom:16px; }
    .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
    .field span{ font-size:0.78rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.05em; }
    .field input{ border:1px solid rgba(27,27,47,0.10); border-radius:10px; padding:10px 12px; font-size:0.95rem; }
    .field input:focus{ outline:2.5px solid var(--teal); border-color:transparent; }
    .auth-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .muted{ color:var(--ink-soft); font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <p class="eyebrow">Customer login</p>
    <h2>Welcome back</h2>
    <p>Sign in to continue shopping with Shoppy.</p>
    <form id="customerLoginForm">
      <div class="field">
        <span>Email</span>
        <input id="customerEmail" type="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <span>Password</span>
        <input id="customerPassword" type="password" placeholder="customer123" required />
      </div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary">Login</button>
        <a href="index.html" class="btn btn-ghost">Back to shop</a>
      </div>
    </form>
    <p class="muted" style="margin-top:14px;">Demo credentials: email <strong>customer@shoppy.com</strong> and password <strong>customer123</strong></p>
  </div>

  <script>
    document.getElementById('customerLoginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('customerEmail').value.trim();
      const password = document.getElementById('customerPassword').value;
      if (email === 'customer@shoppy.com' && password === 'customer123') {
        alert('Customer login successful!');
        window.location.href = 'index.html';
      } else {
        alert('Wrong credentials. Try customer@shoppy.com / customer123');
      }
    });
  </script>
</body>
</html>
